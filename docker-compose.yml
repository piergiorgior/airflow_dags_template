# ============================================================
#  Airflow DAG Templates — Local Development Stack
#  Airflow 3.2.1  |  CeleryExecutor  |  Postgres 17  |  Redis 7
#  Demo services: ClickHouse 24  |  Kafka 7.6 (KRaft)  |  LocalStack 3 (S3)
# ============================================================
#
#  QUICK START:
#    1. echo -e "AIRFLOW_UID=$(id -u)" > .env        (Linux/macOS/Git Bash)
#       or just: copy .env.example .env              (Windows, AIRFLOW_UID defaults to 50000)
#    2. docker compose up airflow-init
#    3. docker compose up -d
#    4. Open http://localhost:8080  (admin / admin)
#
#  STOP:   docker compose down
#  RESET:  docker compose down -v --remove-orphans
# ============================================================

x-airflow-common: &airflow-common
  image: apache/airflow:3.2.1
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: CeleryExecutor
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: 'http://airflow-api-server:8080/execution/'
    AIRFLOW__API_AUTH__JWT_SECRET: 'dev-local-jwt-secret-please-change-this-value-at-least-64-characters-long-1234567890'
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://airflow:airflow@postgres/airflow
    AIRFLOW__CELERY__BROKER_URL: redis://:@redis:6379/0
    AIRFLOW__CORE__FERNET_KEY: ''
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__API__AUTH_BACKENDS: 'airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session'
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'
    AIRFLOW__SCHEDULER__SCHEDULER_HEARTBEAT_SEC: '5'
    _PIP_ADDITIONAL_REQUIREMENTS: kafka-python clickhouse-driver psycopg2-binary boto3
    # _PIP_ADDITIONAL_REQUIREMENTS: ${_PIP_ADDITIONAL_REQUIREMENTS:-}
    # ----------------------------------------------------------
    #  Connections — pre-wired to local demo containers.
    #  Override via .env for production.
    # ----------------------------------------------------------
    AIRFLOW_CONN_POSTGRES_DEFAULT: postgresql://airflow:airflow@postgres:5432/airflow
    AIRFLOW_CONN_POSTGRES_SOURCE: postgresql://demo:demo@postgres-demo:5432/source_db
    AIRFLOW_CONN_POSTGRES_TARGET: postgresql://demo:demo@postgres-demo:5432/target_db
    AIRFLOW_CONN_CLICKHOUSE_ANALYTICS: 'generic://default:@clickhouse:9000/analytics'
    AIRFLOW_CONN_AWS_DEFAULT: '{"conn_type": "aws", "login": "test", "password": "test", "extra": {"endpoint_url": "http://localstack:4566", "region_name": "us-east-1"}}'
    # ----------------------------------------------------------
    #  Variables — consumed by DAG code at runtime
    # ----------------------------------------------------------
    AIRFLOW_VAR_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    AIRFLOW_VAR_S3_BUCKET: airflow-demo
    AIRFLOW_VAR_S3_PREFIX: raw/events
  volumes:
    - ./dags:/opt/airflow/dags
    - ./plugins:/opt/airflow/plugins
    - ./logs:/opt/airflow/logs
    - ./config:/opt/airflow/config
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on: &airflow-common-depends-on
    redis:
      condition: service_healthy
    postgres:
      condition: service_healthy

services:

  # ----------------------------------------------------------
  #  Metadata DB — Postgres 17
  # ----------------------------------------------------------
  postgres:
    image: postgres:17
    container_name: airflow_postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: "no"
    ports:
      - "5432:5432"

  # ----------------------------------------------------------
  #  Celery broker
  # ----------------------------------------------------------
  redis:
    image: redis:7.2-alpine
    container_name: airflow_redis
    expose:
      - 6379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 30s
      retries: 50
      start_period: 30s
    restart: "no"

  # ----------------------------------------------------------
  #  Airflow components
  # ----------------------------------------------------------
  airflow-api-server:
    <<: *airflow-common
    container_name: airflow_api_server
    command: api-server
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: "no"
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow_scheduler
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: "no"
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-worker:
    <<: *airflow-common
    container_name: airflow_worker
    command: celery worker
    environment:
      <<: *airflow-common-env
      DUMB_INIT_SETSID: "0"
    healthcheck:
      test:
        - "CMD-SHELL"
        - 'celery --app airflow.providers.celery.executors.celery_executor.app inspect ping -d "celery@$${HOSTNAME}"'
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: "no"
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-triggerer:
    <<: *airflow-common
    container_name: airflow_triggerer
    command: triggerer
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type TriggererJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: "no"
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  # ----------------------------------------------------------
  #  DAG processor — mandatory separate process in Airflow 3.x
  # ----------------------------------------------------------
  airflow-dag-processor:
    <<: *airflow-common
    container_name: airflow_dag_processor
    command: dag-processor
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: "no"
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  # ----------------------------------------------------------
  #  One-shot init: DB migration + admin user creation.
  #  Uses the official /entrypoint so the Python env is set up
  #  correctly before running airflow commands.
  # ----------------------------------------------------------
  airflow-init:
    <<: *airflow-common
    container_name: airflow_init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        mkdir -p /sources/logs /sources/dags /sources/plugins /sources/config
        chown -R "${AIRFLOW_UID:-50000}:0" /sources/{logs,dags,plugins,config}
        exec /entrypoint airflow version
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: 'true'
      _AIRFLOW_WWW_USER_CREATE: 'true'
      _AIRFLOW_WWW_USER_USERNAME: ${_AIRFLOW_WWW_USER_USERNAME:-admin}
      _AIRFLOW_WWW_USER_PASSWORD: ${_AIRFLOW_WWW_USER_PASSWORD:-admin}
      _PIP_ADDITIONAL_REQUIREMENTS: ''
    user: "0:0"
    volumes:
      - .:/sources

  # ----------------------------------------------------------
  #  Optional: Flower (Celery monitoring UI) → localhost:5555
  #  Start with: docker compose --profile flower up
  # ----------------------------------------------------------
  flower:
    <<: *airflow-common
    container_name: airflow_flower
    command: celery flower
    profiles:
      - flower
    ports:
      - "5555:5555"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:5555/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: "no"
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  # ----------------------------------------------------------
  #  Demo: ClickHouse — analytics target for ETL and S3 DAGs
  #  UI:       http://localhost:8123/play
  #  Native:   localhost:9000  (used by clickhouse-driver)
  # ----------------------------------------------------------
  clickhouse:
    image: clickhouse/clickhouse-server:24
    container_name: airflow_clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./demo/clickhouse_init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: "no"

  # ----------------------------------------------------------
  #  Demo: Kafka (KRaft mode — no Zookeeper)
  #  From host: localhost:9092
  #  From containers: kafka:29092
  # ----------------------------------------------------------
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: airflow_kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://kafka:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s
    restart: "no"

  # ----------------------------------------------------------
  #  Demo: LocalStack — emulates AWS S3 locally
  #  Endpoint: http://localhost:4566
  # ----------------------------------------------------------
  localstack:
    image: localstack/localstack:3
    container_name: airflow_localstack
    ports:
      - "4566:4566"
    environment:
      SERVICES: s3
      LOCALSTACK_HOST: localstack
    volumes:
      - localstack_data:/var/lib/localstack
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: "no"

  # ----------------------------------------------------------
  #  Demo: Postgres — source DB (ETL) + target DB (CDC)
  #  source_db: events table, seeded with 500 rows
  #  target_db: empty events table (CDC upsert target)
  # ----------------------------------------------------------
  postgres-demo:
    image: postgres:17
    container_name: airflow_postgres_demo
    environment:
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
      POSTGRES_DB: source_db
    volumes:
      - postgres_demo_data:/var/lib/postgresql/data
      - ./demo/postgres_init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "demo", "-d", "source_db"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: "no"

  # ----------------------------------------------------------
  #  Demo: one-shot setup — creates Kafka topic, S3 bucket,
  #  uploads sample CSV + _SUCCESS marker, seeds Kafka messages.
  #  Runs after all demo services are healthy.
  # ----------------------------------------------------------
  demo-init:
    image: python:3.12-slim
    container_name: airflow_demo_init
    command:
      - sh
      - -c
      - |
        pip install psycopg2-binary clickhouse-driver kafka-python boto3 -q
        python /demo/setup.py
    volumes:
      - ./demo:/demo:ro
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      LOCALSTACK_ENDPOINT: http://localstack:4566
    depends_on:
      clickhouse:
        condition: service_healthy
      kafka:
        condition: service_healthy
      localstack:
        condition: service_healthy
      postgres-demo:
        condition: service_healthy
    restart: on-failure

volumes:
  postgres_data:
  clickhouse_data:
  localstack_data:
  postgres_demo_data:
